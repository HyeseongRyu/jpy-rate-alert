name: JPY Rate Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JPY/KRW rate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 저장소 Settings > Secrets and variables > Actions > Variables 에서 설정 (선택, 미설정 시 1% 기본값)
          DROP_THRESHOLD_PERCENT: ${{ vars.DROP_THRESHOLD_PERCENT }}
          RISE_THRESHOLD_PERCENT: ${{ vars.RISE_THRESHOLD_PERCENT }}
        run: node check.mjs

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update rate state"
          git push
